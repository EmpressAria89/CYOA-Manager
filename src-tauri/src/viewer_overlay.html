<style>
  :host { all: initial !important; position: fixed !important; inset: 0 !important; pointer-events: none !important; z-index: 2147483647 !important; }
  *, *::before, *::after { box-sizing: border-box; }
  #cyoa-manager-viewer-panel, #cyoa-manager-viewer-gear { pointer-events: auto; font: 400 12px/1.4 system-ui, sans-serif; color: var(--text); }
  #cyoa-manager-viewer-gear {
    position: fixed; right: 8px; bottom: 8px; width: 30px; height: 30px;
    border: 1px solid var(--border); border-radius: 8px; display: inline-flex;
    align-items: center; justify-content: center; background: var(--surface);
    cursor: pointer;
  }
  #cyoa-manager-viewer-gear:hover { background: var(--hover); }
  #cyoa-manager-viewer-gear svg { width: 16px; height: 16px; }
  #cyoa-manager-viewer-panel {
    position: fixed; right: 8px; bottom: 46px; width: min(260px, calc(100vw - 16px));
    padding: 12px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--base); box-shadow: 0 14px 34px #0004;
  }
  #cyoa-manager-viewer-panel[hidden] { display: none; }
  .cyoa-manager-panel-title { font-weight: 400; margin-bottom: 10px; }
  .cyoa-manager-field { display: flex; flex: 1; min-width: 0; flex-direction: column; gap: 6px; }
  .cyoa-manager-row-field { display: flex; gap: 8px; margin-top: 10px; }
  .cyoa-manager-field-label { color: var(--subtext); font-size: 11px; }
  select, input, button { font: 400 12px/1.4 system-ui, sans-serif; }
  #cyoa-manager-viewer-panel select, #cyoa-manager-viewer-panel input, .cyoa-manager-action-button {
    width: 100%; min-width: 0; border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--text); -webkit-text-fill-color: var(--text);
    padding: 7px 9px; color-scheme: var(--scheme);
  }
  #cyoa-manager-viewer-panel select {
    appearance: none; -webkit-appearance: none; padding-right: 24px;
    background-image: linear-gradient(45deg, transparent 50%, var(--text) 50%), linear-gradient(135deg, var(--text) 50%, transparent 50%);
    background-position: calc(100% - 13px) 50%, calc(100% - 9px) 50%;
    background-size: 4px 4px; background-repeat: no-repeat;
  }
  #cyoa-manager-viewer-panel select option { background: var(--surface); color: var(--text); }
  select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .cyoa-manager-action-button[hidden] { display: none; }
  .cyoa-manager-action-button { margin-top: 12px; cursor: pointer; }
  .cyoa-manager-action-button:hover { background: var(--hover); }
</style>

<div id="cyoa-manager-viewer-panel" hidden>
  <div class="cyoa-manager-panel-title">Cheat Menu</div>
  <div class="cyoa-manager-row-field">
    <label class="cyoa-manager-field">
      <span class="cyoa-manager-field-label">Point type</span>
      <select id="cyoa-manager-point-type-select"></select>
    </label>
    <label class="cyoa-manager-field">
      <span class="cyoa-manager-field-label">Sum</span>
      <input id="cyoa-manager-point-type-value" type="number" step="1" />
    </label>
  </div>
  <button id="manager-reveal-hidden" class="cyoa-manager-action-button" type="button" aria-pressed="false" title="Show conditional sections and bonuses. Requirements and point costs still apply." hidden>Show hidden choices</button>
  <button id="cyoa-manager-remove-reqs" class="cyoa-manager-action-button" type="button">Remove all requirements</button>
  <button id="cyoa-manager-unlimited-choices" class="cyoa-manager-action-button" type="button">Unlimited Allowed Choices</button>
</div>
<button id="cyoa-manager-viewer-gear" type="button" title="CYOA Manager tools" aria-label="CYOA Manager tools">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35A1.724 1.724 0 0 0 5.38 7.752c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.573-1.065Z" stroke="currentColor" stroke-width="1.5"/><path d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" stroke="currentColor" stroke-width="1.5"/></svg>
</button>
