name: Linux checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libdav1d-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rust
      - run: pnpm release:linux
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:ui
      - run: python3 scripts/package-linux.py
      - uses: actions/upload-artifact@v6
        with:
          name: cyoa-manager-linux-x86_64
          path: release/*.tar.gz
          if-no-files-found: error
