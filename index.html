<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYOA Manager</title>
    <style>html,body{margin:0;background:var(--startup-base,#1e1e2e);color:#cdd6f4}</style>
    <script>try{const s=JSON.parse(localStorage.getItem('cyoa-manager-settings')||'{}');const t=s.theme==='system'||!s.theme?(matchMedia('(prefers-color-scheme:dark)').matches?'mocha':'latte'):s.theme;document.documentElement.style.setProperty('--startup-base',{latte:'#eff1f5',frappe:'#303446',macchiato:'#24273a',mocha:'#1e1e2e'}[t]||'#1e1e2e');}catch(e){}</script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
